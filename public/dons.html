<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faire un don - FCRTM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #d4af37; color: #1e1a0c; }
    .gold-text { color: #1e1a0c; }
    .bg-gold { background: #d4af37; }
    .btn-gold { background-color: #1e1a0c; color: #d4af37; font-weight: bold; transition: 0.3s; }
    .btn-gold:hover { background-color: #3b2a1a; transform: scale(1.02); }
    .input-field { background: white; border: 1px solid #1e1a0c; color: #1e1a0c; }
    .input-field:focus { outline: none; ring: 2px solid #1e1a0c; }
  </style>
</head>
<body>
  <!-- Barre de retour (fond or) -->
  <nav class="fixed top-0 w-full bg-gold shadow-md py-3">
    <div class="container mx-auto px-6">
      <a href="index.html" class="text-[#1e1a0c] font-semibold hover:underline">← Retour à l'accueil</a>
    </div>
  </nav>

  <section class="pt-32 pb-20 flex justify-center">
    <div class="bg-white/90 p-8 rounded-2xl shadow-2xl w-full max-w-md backdrop-blur-sm">
      <h1 class="text-3xl font-bold text-center text-[#1e1a0c]">Soutenez la FCRTM</h1>
      <form id="donForm" class="mt-6 space-y-4">
        <input type="text" id="nom" placeholder="Votre nom" class="input-field w-full p-2 rounded" required>
        <input type="email" id="email" placeholder="Email" class="input-field w-full p-2 rounded" required>
        <input type="number" id="montant" placeholder="Montant (MGA)" class="input-field w-full p-2 rounded" required>
        <textarea id="message" placeholder="Message" rows="2" class="input-field w-full p-2 rounded"></textarea>
        <button type="submit" class="btn-gold w-full py-2 rounded font-bold">Envoyer mon don</button>
      </form>
      <div id="response" class="mt-4 text-center text-[#1e1a0c] font-semibold"></div>
    </div>
  </section>

  <script>
    document.getElementById('donForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nom = document.getElementById('nom').value;
      const email = document.getElementById('email').value;
      const montant = document.getElementById('montant').value;
      const message = document.getElementById('message').value;
      // Simulation (pas de backend actif ici, mais on garde l'appel pour compatibilité)
      try {
        const res = await fetch('/api/dons', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nom, email, montant, message }) });
        const data = await res.json();
        document.getElementById('response').innerHTML = `<div class="bg-green-700 text-white p-2 rounded">${data.message}</div>`;
      } catch (error) {
        // Fallback si pas de serveur
        document.getElementById('response').innerHTML = `<div class="bg-green-700 text-white p-2 rounded">Merci ${nom} pour votre don de ${montant} MGA ! Votre soutien est précieux. (Simulation)</div>`;
      }
      document.getElementById('donForm').reset();
      setTimeout(() => document.getElementById('response').innerHTML = '', 5000);
    });
  </script>
</body>
</html>
